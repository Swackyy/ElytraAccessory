plugins {
    id "idea"
    id "java"
    id "maven-publish"
    id "signing"
}

group "com.swacky.${modId}"
version "${project.name}+${mcV}"

base {
    archivesName.set "${modId}-${modV}"
}

java {
    toolchain.languageVersion.set JavaLanguageVersion.of(javaV)
}

processResources {
    var replaceProperties = [
            modId          : modId,
            packFormatMinV : packFormatMinV,
            packFormatMaxV : packFormatMaxV
    ]

    inputs.properties replaceProperties

    filesMatching(["pack.mcmeta", "resourcepacks/*/pack.mcmeta"]) {
        expand replaceProperties
    }

    exclude "META-INF/accesstransformer.cfg"
}

repositories {
    mavenCentral()

    maven {
        name = "Curse maven"
        url = "https://cursemaven.com"

        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    implementation "org.jspecify:jspecify:1.0.0"

    if (project.name != "fabric") {
        implementation "io.github.swackyy:ohmega-${project.name}:${ohmegaV}-mc${mcV}"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set JavaLanguageVersion.of(javaV).asInt()
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

['apiElements', 'runtimeElements'].each { variant ->
    configurations."${variant}".outgoing {
        capability("${group}:${base.archivesName.get()}:${version}")
        capability("${group}:${modId}-${project.name}-${mcV}:${version}")
        capability("${group}:${modId}:$version")
    }
}